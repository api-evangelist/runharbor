name: Runharbor
description: >-
  Harbor (Runharbor) is an AI-native contract research organization (CRO) and
  eClinical data management platform for clinical trials. Its software automates
  the core clinical-trial data lifecycle — study build, electronic data capture
  (eCRF/ePRO), source-document extraction, query generation, risk-based remote
  monitoring, electronic signature, and database lock — using AI to cut manual
  data entry and accelerate regulatory submissions. The platform is designed for
  21 CFR Part 11, HIPAA, and ICH E6 (GCP) compliance, with per-trial database
  isolation and zero standing access to client data. Harbor is offered both as
  software (Magic Build, Magic Capture, Magic Monitor) and as full-service trial
  execution for sponsors and CROs. Founded in 2025 in San Francisco and backed
  by Y Combinator (Spring 2026), Google Cloud, and the NVIDIA Inception Program.
